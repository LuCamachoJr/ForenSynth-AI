[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forensynth-ai"
version = "2.4.0b1"
description = "Evidence-linked Windows DFIR reporting with optional AI synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.23,<5", "stix2>=3.0.1,<4"]

[project.optional-dependencies]
llm = ["openai>=1.109,<3", "tiktoken>=0.12,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "stix2-validator==3.2.0"]
desktop = ["pyinstaller>=6.11,<7"]

[project.scripts]
forensynth = "forensynth.cli:main"

[project.gui-scripts]
forensynth-gui = "forensynth.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["forensynth*"]

[tool.setuptools.package-data]
forensynth = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
